[build-system]
requires = ["setuptools>=77,<81", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "spabound"
version = "0.1.0"
description = "Boundary-aware graph learning for paired spatial multi-omics"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = "AGPL-3.0-only"
license-files = ["LICENSE", "NOTICE.md", "licenses/*.txt"]
keywords = ["spatial-omics", "multimodal", "graph-learning", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "torch>=2.1,<3",
    "setuptools>=68,<81",
    "numpy>=1.24,<2",
    "scipy>=1.10,<2",
    "pandas>=1.5,<3",
    "scikit-learn>=1.2,<2",
    "scanpy>=1.9.3,<1.10",
    "anndata>=0.9,<0.10",
    "matplotlib>=3.7,<4",
    "seaborn>=0.12,<0.14",
    "tqdm>=4.65,<5",
]

[project.optional-dependencies]
examples = ["jupyterlab>=4,<5", "scikit-misc>=0.3,<0.6"]
mclust = ["rpy2>=3.4"]
leiden = ["igraph>=0.10,<0.12", "leidenalg>=0.10,<0.11"]
louvain = ["igraph>=0.10,<0.12", "louvain>=0.8,<0.9"]
dev = ["pytest>=7", "build>=1"]

[tool.setuptools.packages.find]
where = ["."]
include = ["spabound*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
